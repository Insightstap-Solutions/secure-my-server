# HTTP context (inside http { }). Examples of where that is:
#   distro nginx: /etc/nginx/conf.d/00-edge-limits.conf
#   aaPanel:      /www/server/panel/vhost/nginx/0.request_limits.conf
# Tune rates from MEASURED traffic (peak req/s per signed-in IP; corporate NAT).

# 1 = multipart request without a usable boundary (the PHP2Shell request shape)
map $http_content_type $edge_bad_multipart {
    default 0;
    "~*^multipart/form-data(?!.*boundary=(\"[^\"]+\"|[^;\s\"]+))" 1;
}

# Request class: webhook senders and static files get their own buckets.
map $uri $edge_class {
    default app;
    ~^/(api/webhooks/) hook;
    ~^/(build|css|js|vendor|fonts|images|storage)/ static;
    ~*\.(css|js|png|jpe?g|gif|svg|ico|woff2?|ttf|map)$ static;
}
map $edge_class $edge_key_app    { app    $binary_remote_addr; default ""; }
map $edge_class $edge_key_static { static $binary_remote_addr; default ""; }
map $edge_class $edge_key_hook   { hook   $binary_remote_addr; default ""; }

limit_req_zone  $edge_key_app    zone=edge_app:10m    rate=20r/s;
limit_req_zone  $edge_key_static zone=edge_static:10m rate=100r/s;
limit_req_zone  $edge_key_hook   zone=edge_hook:10m   rate=50r/s;
limit_conn_zone $edge_key_app    zone=edge_conn_app:10m;
limit_conn_zone $edge_key_hook   zone=edge_conn_hook:10m;
