; Copy to /usr/local/etc/php-fpm.d/zz-pool.conf (sorts after www.conf).
; Values come from env vars. Compose MUST give defaults, e.g.
;   PHP_FPM_MAX_CHILDREN: ${PHP_FPM_MAX_CHILDREN:-20}
; and the Dockerfile should set ENV defaults, or FPM refuses to start.
[www]
pm = dynamic
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.start_servers = ${PHP_FPM_START_SERVERS}
pm.min_spare_servers = ${PHP_FPM_MIN_SPARE_SERVERS}
pm.max_spare_servers = ${PHP_FPM_MAX_SPARE_SERVERS}
pm.max_requests = 500
pm.status_path = /fpm-status
ping.path = /fpm-ping
catch_workers_output = yes
; Pin hardening for FPM so ini_set() / .user.ini cannot undo it:
php_admin_flag[display_errors] = off
php_admin_flag[display_startup_errors] = off
php_admin_flag[log_errors] = on
php_admin_flag[session.upload_progress.enabled] = off
