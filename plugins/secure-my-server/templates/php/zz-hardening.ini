; secure-my-server: PHP hardening for web SAPIs (FPM, mod_php, LiteSpeed, CGI).
;
; Put this file in the conf.d (scan) directory of EVERY PHP that serves web
; requests, named so it loads LAST (zz-...). The directory differs per stack:
;   Docker official image ..... /usr/local/etc/php/conf.d/
;   Debian / Ubuntu ........... /etc/php/<X.Y>/fpm/conf.d/  (and apache2/conf.d/ for mod_php)
;   RHEL family ............... /etc/php.d/   (Remi SCL: /etc/opt/remi/php<XY>/php.d/)
;   Others .................... see guides/php/<your stack>.md
; Then restart EVERY worker (a reload is not enough for mod_php).
;
; Values set here can still be overridden per site (pool php_value, .user.ini,
; .htaccess, panel "PHP settings"). For FPM, pin the important ones in the pool
; with php_admin_flag / php_admin_value as well (see zz-pool.conf).

; Errors go to the log, never to the visitor.
display_errors = Off
display_startup_errors = Off
log_errors = On
; Docker: log to the container's stderr. On a normal host, remove this line or
; point it at a file the PHP user can write.
error_log = /proc/self/fd/2

; Do not advertise the PHP version (X-Powered-By header).
expose_php = Off

; CVE-2026-109619 mitigation, and php.net's 23 Oct 2026 advice for
; CVE-2026-115560: keep it Off until the next regular bugfix release, even on a
; patched PHP. Almost no application uses it (grep for "upload_progress" first).
session.upload_progress.enabled = Off

; PHP 8.5 only: CVE-2026-109619 fatal-backtrace path. Unknown keys are ignored
; by older PHP, but uncomment it only on 8.5 to keep the file honest.
; fatal_error_backtraces = Off

; Request size: php.net suggests 8M for apps without uploads, 32M with uploads.
; Set it to what the application really needs; upload_max_filesize must stay
; below post_max_size. Uncomment and adjust:
; post_max_size = 8M
; upload_max_filesize = 6M
;
; NOT here on purpose: memory_limit = -1. php.net lists it as a temporary
; mitigation for CVE-2026-109618 ONLY while you cannot patch, and only together
; with a container/cgroup memory limit. Patch instead.
