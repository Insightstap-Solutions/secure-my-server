schema_version: "1.1"
name: docker-port-bypasses-ufw
expected_outcome: |
  Explains that a Docker-published port (docker-proxy on 0.0.0.0:6379) bypasses ufw INPUT rules because it is DNAT'ed through FORWARD, so the ufw deny does not protect it. Recommends binding Redis to 127.0.0.1 in compose (or not publishing it at all), adding a DOCKER-USER rule, requiring a Redis password, checking whether it was already abused, and verifying from outside on IPv4 and IPv6. Asks before recreating containers or changing the firewall.
context:
  scaffold_script: place-files.sh
